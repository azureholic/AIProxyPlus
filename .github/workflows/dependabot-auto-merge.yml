name: Dependabot Auto-merge

on:
  workflow_run:
    workflows:
      - Dependabot Validation
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  approve-and-enable-auto-merge:
    name: Approve and enable auto-merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify Dependabot pull request
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          author=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.user.login')
          base=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')
          head_repository=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')
          state=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.state')

          if [[ "${author}" != "dependabot[bot]" ||
                "${base}" != "main" ||
                "${head_repository}" != "${REPOSITORY}" ||
                "${state}" != "open" ]]; then
            echo "Pull request is not an open Dependabot update targeting this repository's main branch."
            exit 1
          fi

      - name: Approve pull request
        shell: bash
        run: |
          set -euo pipefail

          approval_count=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED")] | length')

          if [[ "${approval_count}" == "0" ]]; then
            gh pr review "${PR_NUMBER}" \
              --repo "${REPOSITORY}" \
              --approve \
              --body "Dependabot validation compiled the solution and passed all configured unit, architecture, and frontend checks."
          fi

      - name: Enable squash auto-merge
        shell: bash
        run: |
          set -euo pipefail

          auto_merge_enabled=$(gh pr view "${PR_NUMBER}" \
            --repo "${REPOSITORY}" \
            --json autoMergeRequest \
            --jq '.autoMergeRequest != null')

          if [[ "${auto_merge_enabled}" != "true" ]]; then
            gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" --auto --squash --delete-branch
          fi
