name: Dependabot Validation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: dependabot-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile and run unit tests
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/AIProxyPlus.Web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore AIProxyPlus.sln --configfile NuGet.config

      - name: Compile solution
        run: dotnet build AIProxyPlus.sln --configuration Release --no-restore

      - name: Run backend unit and architecture tests
        shell: pwsh
        run: |
          dotnet test tests/AIProxyPlus.Domain.Tests/AIProxyPlus.Domain.Tests.csproj --configuration Release --no-build
          dotnet test tests/AIProxyPlus.Application.Tests/AIProxyPlus.Application.Tests.csproj --configuration Release --no-build
          dotnet test tests/AIProxyPlus.ArchitectureTests/AIProxyPlus.ArchitectureTests.csproj --configuration Release --no-build

      - name: Install frontend dependencies
        working-directory: src/AIProxyPlus.Web
        run: npm ci

      - name: Run frontend unit tests
        working-directory: src/AIProxyPlus.Web
        run: npm test

      - name: Compile production frontend
        working-directory: src/AIProxyPlus.Web
        run: npm run build

