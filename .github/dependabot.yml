version: 2
registries:
  microsoft-cfs-npm:
    type: npm-registry
    url: https://packagefeedproxy.microsoft.io/npm/
    replaces-base: true

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/src/AIProxyPlus.Web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    registries:
      - microsoft-cfs-npm
