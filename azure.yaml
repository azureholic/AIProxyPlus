# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ai-proxy-v2
services:
  app:
    language: dotnet
    project: ./src/AIProxyPlus.AppHost/AIProxyPlus.AppHost.csproj
    host: containerapp

hooks:
  predeploy:
    shell: pwsh
    run: ./infra/hooks/initialize-consumer-pepper.ps1
    interactive: false
    continueOnError: false
  postprovision:
    shell: pwsh
    run: ./infra/hooks/postprovision.ps1
    interactive: false
    continueOnError: false
