services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: aiproxyplus
      POSTGRES_PASSWORD: aiproxyplus-dev-only
      POSTGRES_DB: aiproxyplusdb
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiproxyplus -d aiproxyplusdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local-only file-backed Vault bootstrap. Production deployments must use operator-managed unseal and AppRole.
  vault:
    image: hashicorp/vault:2.0.3
    entrypoint: ["/bin/sh", "/vault/config/bootstrap.sh"]
    volumes:
      - vault-data:/vault/file
      - ./src/AIProxyPlus.AppHost/vault:/vault/config:ro
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AIProxyPlus.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__aiproxyplusdb: "Host=postgres;Database=aiproxyplusdb;Username=aiproxyplus;Password=aiproxyplus-dev-only"
      Vault__Address: "http://vault:8200"
      Vault__Token: "dev-only-root-token"
      # Point at an external OTLP collector if you have one; leave unset to disable OTLP export.
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

volumes:
  postgres-data:
  vault-data:
